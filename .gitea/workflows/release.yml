name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get update -y && sudo apt-get install -y mingw-w64

      - name: Build release binary (Linux)
        run: cargo build --release

      - name: Build release binary (Windows)
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Stage Linux install layout
        run: |
          rm -rf staging-linux
          mkdir -p staging-linux/bin staging-linux/zern/std
          cp target/release/zern staging-linux/zern/zern
          cp -r std/. staging-linux/zern/std/
          cp LICENSE staging-linux/zern/LICENSE
          ln -s ../zern/zern staging-linux/bin/zern

      - name: Stage Windows install layout
        run: |
          rm -rf staging-windows
          mkdir -p staging-windows/zern/std
          cp target/x86_64-pc-windows-gnu/release/zern.exe staging-windows/zern/zern.exe
          cp -r std/. staging-windows/zern/std/
          cp LICENSE staging-windows/zern/LICENSE

      - name: Create release archives
        env:
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: |
          tar -czf "zern-${RELEASE_TAG}-linux-x86_64.tar.gz" -C staging-linux .
          cd staging-windows
          zip -r "../zern-${RELEASE_TAG}-windows-x86_64.zip" .

      - name: Upload release assets
        uses: akkuman/gitea-release-action@v1
        with:
          files: |
            zern-v*-linux-x86_64.tar.gz
            zern-v*-windows-x86_64.zip
